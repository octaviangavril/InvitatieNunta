<!doctype html>
<html lang="ro">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Pozele de la nuntă · Ștefana & Octavian</title>
<meta name="description" content="Trimiteți-le Ștefanei și lui Octavian pozele și filmulețele de la nuntă, pe WhatsApp.">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Cpath fill='%238e6bbf' d='M16 29S3 21 3 11.5A6.5 6.5 0 0 1 16 8a6.5 6.5 0 0 1 13 3.5C29 21 16 29 16 29z'/%3E%3C/svg%3E">
<meta name="theme-color" content="#8e6bbf">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Great+Vibes&family=Cormorant+Garamond:ital,wght@0,400;0,500;0,600;1,400&family=Jost:wght@300;400;500&display=swap" rel="stylesheet">
<style>
:root{
  --lav:#8e6bbf; --lav-d:#5b3f8c; --lav-m:#b9a3dc; --lav-l:#efe8f8;
  --ivory:#fdfbf7; --gold:#b8975a; --gold-l:#e3cf9f; --ink:#3d2f52; --muted:#6e6280;
  --script:'Great Vibes', 'Brush Script MT', cursive;
  --serif:'Cormorant Garamond', Georgia, 'Times New Roman', serif;
  --sans:'Jost', 'Segoe UI', Helvetica, Arial, sans-serif;
}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--ivory);color:var(--ink);font-family:var(--serif);font-size:19px;line-height:1.6;overflow-x:hidden;font-variant-numeric:lining-nums}
body::before{content:"";position:fixed;inset:0;z-index:-1;pointer-events:none;
  background:
    radial-gradient(60vmax 50vmax at 0% 0%, rgba(185,163,220,.28), transparent 60%),
    radial-gradient(50vmax 45vmax at 100% 30%, rgba(143,165,138,.16), transparent 60%),
    radial-gradient(60vmax 50vmax at 30% 100%, rgba(185,163,220,.22), transparent 60%),
    var(--ivory)}
a{color:var(--lav-d)}
[hidden]{display:none!important}
#fx{position:fixed;inset:0;width:100%;height:100%;pointer-events:none;z-index:10}
main{max-width:640px;margin:0 auto;padding:3rem 20px 1rem;text-align:center}
.mono{width:104px;height:104px;margin:0 auto 1rem;border-radius:50%;display:flex;align-items:center;justify-content:center;
  border:1px solid var(--gold);box-shadow:inset 0 0 0 4px var(--ivory),inset 0 0 0 5px var(--gold-l);
  font-family:var(--script);font-size:1.95rem;color:var(--lav-d);line-height:1;padding-top:.15em}
.title{font-family:var(--script);font-weight:400;color:var(--lav-d);font-size:clamp(2.7rem,11vw,3.8rem);line-height:1.15;margin:0 0 .6rem}
.lead{max-width:30em;margin:0 auto;font-size:1.2rem;text-wrap:balance}
.divider{display:flex;align-items:center;justify-content:center;gap:12px;margin:1.2rem auto 0;max-width:320px}
.divider span{flex:1;height:1px;background:linear-gradient(90deg,transparent,var(--gold))}
.divider span:last-child{background:linear-gradient(270deg,transparent,var(--gold))}
.divider svg{width:60px;height:30px;flex:none}
.data{font-family:var(--sans);font-size:.74rem;letter-spacing:.38em;text-transform:uppercase;color:var(--gold);margin:.3rem 0 0;padding-left:.38em}
.card{margin-top:2rem;padding:1.6rem 1.2rem;background:rgba(255,255,255,.72);border:1px solid rgba(184,151,90,.35);border-radius:24px;
  box-shadow:0 18px 40px -24px rgba(91,63,140,.45), inset 0 0 0 6px rgba(255,255,255,.6), inset 0 0 0 7px rgba(184,151,90,.18)}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:.55rem;border:0;cursor:pointer;text-decoration:none;
  font-family:var(--sans);font-size:.86rem;letter-spacing:.08em;padding:.95rem 1.4rem;border-radius:999px;
  background:linear-gradient(135deg,var(--lav),var(--lav-d));color:#fff;box-shadow:0 10px 20px -10px rgba(91,63,140,.8);
  transition:transform .25s ease, box-shadow .25s ease, opacity .25s;position:relative;overflow:hidden}
.btn::after{content:"";position:absolute;top:0;left:-60%;width:40%;height:100%;transform:skewX(-20deg);
  background:linear-gradient(90deg,transparent,rgba(255,255,255,.45),transparent);animation:shine 4s ease-in-out infinite}
@keyframes shine{0%,60%{left:-60%}100%{left:130%}}
.btn:hover{transform:translateY(-2px);box-shadow:0 14px 26px -10px rgba(91,63,140,.9)}
.btn:disabled{opacity:.6;cursor:default;transform:none}
.btn.ghost{background:#fff;color:var(--lav-d);border:1px solid var(--lav-m);box-shadow:none;padding:.7rem 1.2rem}
.btn.ghost::after{display:none}
.btn svg{width:18px;height:18px;flex:none}
.wa-btns{display:flex;gap:12px;justify-content:center;flex-wrap:wrap}
.hint{font-size:1rem;color:var(--muted);margin:1rem 0 0}
#trimite{width:min(100%,320px);font-size:.95rem}
#pas{font-family:var(--sans);font-size:.72rem;letter-spacing:.12em;color:var(--muted);margin:.7rem 0 0}
#nota{margin:.6rem 0 0;font-size:1.1rem}
#nota b{color:var(--lav-d);font-weight:600}
.alert{margin:1rem auto 0;max-width:30em;padding:.7rem 1rem;border-radius:14px;background:var(--lav-l);font-size:1rem;color:var(--ink)}
#preaMari p{margin:0}
#miniaturi{display:grid;grid-template-columns:repeat(auto-fill,minmax(74px,1fr));gap:6px;margin-top:1.3rem}
.mini{position:relative;aspect-ratio:1;border-radius:10px;overflow:hidden;background:var(--lav-l)}
.mini img,.mini video{width:100%;height:100%;object-fit:cover;display:block}
.mini.mare{opacity:.4}
.play{position:absolute;inset:0;margin:auto;width:30px;height:30px;border-radius:50%;background:rgba(61,47,82,.55)}
.play::after{content:"";position:absolute;left:12px;top:9px;border-left:10px solid #fff;border-top:6px solid transparent;border-bottom:6px solid transparent}
#alegeDinNou{margin-top:1.2rem}
#multumim h2{font-family:var(--script);font-weight:400;font-size:3rem;color:var(--lav-d);margin:0;line-height:1.2}
#multumim p{margin:.3rem 0 1.2rem}
footer{max-width:640px;margin:0 auto;padding:1.5rem 20px calc(2rem + env(safe-area-inset-bottom,0px));text-align:center;font-size:1rem;color:var(--muted)}
#rezerva{white-space:nowrap}
@media (max-width:600px){
  body{font-size:18px}
  main{padding-top:2.2rem}
  .card{padding:1.4rem 14px}
  .wa-btns{flex-direction:column;align-items:center}
  .wa-btns .btn{width:min(100%,290px)}
}
@media (prefers-reduced-motion:reduce){
  *,*::before,*::after{animation-duration:.01ms!important;animation-iteration-count:1!important;transition-duration:.01ms!important}
}
</style>
</head>
<body>
<svg width="0" height="0" style="position:absolute" aria-hidden="true">
  <defs>
    <linearGradient id="gHeart" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#b9a3dc"/><stop offset="1" stop-color="#5b3f8c"/></linearGradient>
    <symbol id="heart" viewBox="0 0 32 30"><path d="M16 29S2 20.5 2 10.5C2 5.5 5.8 2 10 2c2.7 0 4.8 1.4 6 3.5C17.2 3.4 19.3 2 22 2c4.2 0 8 3.5 8 8.5C30 20.5 16 29 16 29z"/></symbol>
    <symbol id="wa" viewBox="0 0 24 24"><path d="M12 2a10 10 0 0 0-8.6 15.1L2 22l5-1.3A10 10 0 1 0 12 2zm0 18.2a8.2 8.2 0 0 1-4.2-1.1l-.3-.2-3 .8.8-2.9-.2-.3A8.2 8.2 0 1 1 12 20.2zm4.5-6.1c-.2-.1-1.5-.7-1.7-.8s-.4-.1-.6.1-.7.8-.8 1-.3.2-.5.1a6.7 6.7 0 0 1-3.3-2.9c-.2-.4.2-.4.7-1.3.1-.2 0-.3 0-.4l-.8-1.8c-.2-.5-.4-.4-.6-.4h-.5a1 1 0 0 0-.7.3 3 3 0 0 0-.9 2.2 5.1 5.1 0 0 0 1.1 2.7 11.7 11.7 0 0 0 4.5 4c1.7.7 2.3.8 3.2.6a2.7 2.7 0 0 0 1.8-1.2 2.2 2.2 0 0 0 .1-1.3c0-.1-.2-.2-.4-.3z"/></symbol>
  </defs>
</svg>
<canvas id="fx" aria-hidden="true"></canvas>

<main>
  <header>
    <div class="mono" aria-hidden="true">Ș&amp;O</div>
    <h1 class="title">Pozele de la nuntă</h1>
    <p class="lead">Ziua noastră, prin ochii voștri. Trimiteți-ne pozele și filmulețele voastre pe WhatsApp.</p>
    <div class="divider" aria-hidden="true"><span></span><svg viewBox="0 0 70 34"><circle cx="13" cy="17" r="1.6" fill="#b8975a"/><circle cx="20" cy="17" r="1" fill="#b8975a"/><use href="#heart" x="26" y="8" width="18" height="17" fill="url(#gHeart)"/><circle cx="50" cy="17" r="1" fill="#b8975a"/><circle cx="57" cy="17" r="1.6" fill="#b8975a"/></svg><span></span></div>
    <p class="data">22 mai 2027</p>
  </header>

  <section id="alege" class="card">
    <div class="wa-btns">
      <button class="btn" id="btnMireasa" data-to="mireasa"><svg><use href="#wa" fill="currentColor"/></svg>Trimite Ștefanei</button>
      <button class="btn" id="btnMire" data-to="mire"><svg><use href="#wa" fill="currentColor"/></svg>Trimite lui Octavian</button>
    </div>
    <p class="hint" id="indemn">Alegeți cui trimiteți, apoi pozele din galerie.</p>
    <input type="file" id="galerie" multiple accept="image/*,video/*" hidden>
  </section>

  <section id="selectie" class="card" hidden>
    <button class="btn" id="trimite"><svg><use href="#wa" fill="currentColor"/></svg><span>Trimite pe WhatsApp</span></button>
    <p id="pas" hidden></p>
    <p id="nota"></p>
    <p class="alert" id="eroare" hidden></p>
    <div id="miniaturi"></div>
    <div class="alert" id="preaMari" hidden></div>
    <button class="btn ghost" id="alegeDinNou">Alege din nou</button>
  </section>

  <section id="multumim" class="card" hidden>
    <h2>Mulțumim!</h2>
    <p>Ne bucurăm de fiecare amintire de la voi.</p>
    <p id="nefacute" hidden></p>
    <button class="btn ghost" id="maiTrimit">Mai trimit</button>
  </section>
</main>

<footer>Nu ne găsiți în WhatsApp? <a id="rezerva" href="#">Deschideți conversația cu Ștefana</a></footer>

<script>
const CONFIG = {
  whatsapp: { mireasa: '40786895272', mire: '40751370116' },
  maxFisiere: 10,
  maxOcteti: 47185920
};
const NUME = { mireasa: 'Ștefana', mire: 'Octavian' };

const $ = s => document.querySelector(s);
const mob = /Android|iPhone|iPad|iPod/i.test(navigator.userAgent) || (navigator.maxTouchPoints > 1 && /Mac/.test(navigator.platform));
let poateShare = false;
try { poateShare = !!(navigator.canShare && navigator.canShare({ files: [new File([''], 'a.jpg', { type: 'image/jpeg' })] })); } catch (e) {}

// împarte fișierele în tranșe de cel mult maxFisiere și maxOcteti
function transe(files) {
  const t = [], preaMari = [];
  let cur = [], oct = 0;
  for (const f of files) {
    if (f.size > CONFIG.maxOcteti) { preaMari.push(f); continue; }
    if (cur.length === CONFIG.maxFisiere || oct + f.size > CONFIG.maxOcteti) { t.push(cur); cur = []; oct = 0; }
    cur.push(f); oct += f.size;
  }
  if (cur.length) t.push(cur);
  return { transe: t, preaMari };
}

const galerie = $('#galerie'), trimite = $('#trimite'), eroare = $('#eroare');
const stare = { to: 'mireasa', transe: [], i: 0, urls: [], nefacute: [] };
const link = () => (mob ? 'whatsapp://send?phone=' : 'https://wa.me/') + CONFIG.whatsapp[stare.to];
const nefTrimis = (nume, fel) => nume.length === 1
  ? `Fișierul ${nume[0]} ${fel[0]} din pagină. Atașați-l direct în WhatsApp.`
  : `Fișierele ${nume.join(', ')} ${fel[1]} din pagină. Atașați-le direct în WhatsApp.`;
const linkHtml = pre => `<a class="conv" data-pre="${pre}" href="${link()}"${mob ? '' : ' target="_blank" rel="noopener"'}>${pre}${NUME[stare.to]}</a>`;

function destinatar(to) {
  stare.to = to;
  $('#nota').innerHTML = `În WhatsApp alegeți <b>${NUME[to]}</b>`;
  const r = $('#rezerva');
  r.href = link(); r.textContent = `Deschideți conversația cu ${NUME[to]}`;
  if (mob) r.removeAttribute('target'); else { r.target = '_blank'; r.rel = 'noopener'; }
  eroare.hidden = true;
  document.querySelectorAll('a.conv').forEach(a => { a.href = link(); a.textContent = a.dataset.pre + NUME[to]; });
}

function butonTrimite() {
  const n = stare.transe.length;
  trimite.hidden = $('#pas').hidden = $('#nota').hidden = !n;
  if (!n) return;
  let a = 1;
  for (let k = 0; k < stare.i; k++) a += stare.transe[k].length;
  const b = a + stare.transe[stare.i].length - 1;
  trimite.querySelector('span').textContent = n === 1 ? 'Trimite pe WhatsApp' : a === b ? `Trimite ${a}` : `Trimite ${a}–${b}`;
  $('#pas').hidden = n === 1;
  $('#nota').hidden = false;
  $('#pas').textContent = `Partea ${stare.i + 1} din ${n} · după fiecare trimitere, reveniți aici`;
}

function miniatura(f) {
  const u = URL.createObjectURL(f), d = document.createElement('div');
  stare.urls.push(u);
  d.className = 'mini' + (f.size > CONFIG.maxOcteti ? ' mare' : '');
  d.innerHTML = f.type.startsWith('video/')
    ? `<video muted playsinline preload="metadata" src="${u}#t=0.1"></video><span class="play"></span>`
    : `<img loading="lazy" alt="" src="${u}">`;
  return d;
}

function curata() {
  stare.urls.forEach(u => URL.revokeObjectURL(u));
  stare.urls = []; stare.transe = []; stare.i = 0; stare.nefacute = [];
  $('#miniaturi').replaceChildren();
}

document.querySelectorAll('[data-to]').forEach(b => b.addEventListener('click', () => {
  destinatar(b.dataset.to);
  if (!poateShare) {
    if (mob) location.href = link(); else window.open(link(), '_blank');
    return;
  }
  galerie.value = ''; galerie.click();
}));
$('#alegeDinNou').addEventListener('click', () => { galerie.value = ''; galerie.click(); });

galerie.addEventListener('change', () => {
  const files = [...galerie.files];
  if (!files.length) return;
  curata();
  const r = transe(files);
  stare.nefacute = r.preaMari.map(f => f.name);
  stare.transe = r.transe;
  $('#miniaturi').replaceChildren(...files.map(miniatura));
  const pm = $('#preaMari');
  pm.hidden = !r.preaMari.length;
  pm.replaceChildren(...r.preaMari.map(f => {
    const p = document.createElement('p');
    p.textContent = `${f.type.startsWith('video/') ? 'Filmulețul' : 'Fișierul'} ${f.name} e prea mare pentru trimiterea din pagină. Atașați-l direct în WhatsApp.`;
    return p;
  }));
  if (!r.transe.length) { const p = document.createElement('p'); p.innerHTML = linkHtml('Deschideți conversația cu '); pm.append(p); }
  eroare.hidden = true;
  butonTrimite();
  $('#selectie').hidden = false;
  $('#selectie').scrollIntoView({ behavior: 'smooth', block: 'start' });
});

// share se apelează direct în click, ca să aibă gestul utilizatorului
trimite.addEventListener('click', () => {
  const files = stare.transe[stare.i];
  let p;
  try {
    if (!navigator.canShare({ files })) throw new DOMException('', 'NotAllowedError');
    p = navigator.share({ files });
  } catch (e) { p = Promise.reject(e); }
  eroare.hidden = true;
  trimite.disabled = true;
  p.then(avanseaza, e => {
    if (e.name === 'AbortError') return;
    const p = document.createElement('p');
    p.textContent = nefTrimis(files.map(f => f.name), ['nu a putut fi trimis', 'nu au putut fi trimise']);
    stare.nefacute.push(...files.map(f => f.name));
    $('#preaMari').append(p); $('#preaMari').hidden = false;
    eroare.innerHTML = `Telefonul nu a putut trimite aceste fișiere. Atașați-le direct în WhatsApp, cu agrafa, în ${linkHtml('conversația cu ')}.`;
    eroare.hidden = false;
    avanseaza();
  }).finally(() => { trimite.disabled = false; });
});

function avanseaza() {
  if (++stare.i < stare.transe.length) return butonTrimite();
  $('#alege').hidden = $('#selectie').hidden = true;
  const nf = $('#nefacute');
  nf.hidden = !stare.nefacute.length;
  nf.textContent = nefTrimis(stare.nefacute, ['nu a fost trimis', 'nu au fost trimise']) + ' ';
  nf.insertAdjacentHTML('beforeend', linkHtml('Deschideți conversația cu '));
  $('#multumim').hidden = false;
  $('#multumim').scrollIntoView({ behavior: 'smooth', block: 'center' });
  ploaie();
}

$('#maiTrimit').addEventListener('click', () => {
  curata();
  $('#multumim').hidden = $('#selectie').hidden = true;
  $('#alege').hidden = false;
  scrollTo({ top: 0, behavior: 'smooth' });
});

if (!poateShare) $('#indemn').textContent = 'Atașați pozele direct în WhatsApp, cu agrafa.';
destinatar('mireasa');

/* ---------- Floricele de liliac care cad ---------- */
(() => {
  const cvs = $('#fx'), ctx = cvs.getContext('2d'), reduced = matchMedia('(prefers-reduced-motion: reduce)').matches;
  const COL = ['#c9a3d9', '#b38bc9', '#dcc2e8', '#ffffff', '#efe3f5', '#a97fc2'];
  const rnd = (a, b) => a + Math.random() * (b - a);
  let W = 0, H = 0;
  function resize() {
    const dpr = Math.min(devicePixelRatio || 1, 2);
    W = innerWidth; H = innerHeight; cvs.width = W * dpr; cvs.height = H * dpr;
    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
  }
  resize(); addEventListener('resize', resize);
  const nou = sus => ({ x: rnd(0, W), y: sus ? rnd(-H * .5, -20) : rnd(0, H), s: rnd(6, 13), vy: rnd(.35, 1.1), vx: rnd(-.3, .4),
    a: rnd(0, 6.28), va: rnd(-.02, .02), sw: rnd(0, 6.28), fl: rnd(0, 6.28), c: COL[(Math.random() * COL.length) | 0] });
  const tinta = () => reduced ? 4 : (W < 600 ? 10 : 16);
  const petale = Array.from({ length: tinta() }, () => nou(false));
  window.ploaie = () => { for (let i = 0; i < (reduced ? 8 : 60); i++) petale.push({ ...nou(true), vy: rnd(1.6, 3) }); };
  function cadru() {
    ctx.clearRect(0, 0, W, H);
    for (let i = petale.length - 1; i >= 0; i--) {
      const p = petale[i];
      p.sw += .02; p.fl += .03; p.a += p.va; p.x += p.vx + Math.sin(p.sw) * .6; p.y += p.vy;
      if (p.y > H + 30 || p.x < -40 || p.x > W + 40) {
        if (petale.length > tinta()) { petale.splice(i, 1); continue; }
        Object.assign(p, nou(true));
      }
      ctx.save(); ctx.translate(p.x, p.y); ctx.rotate(p.a); ctx.scale(1, Math.abs(Math.cos(p.fl)) * .8 + .2);
      const s = p.s * .55;
      ctx.fillStyle = p.c; ctx.globalAlpha = .9; ctx.strokeStyle = 'rgba(142,107,191,.3)'; ctx.lineWidth = .6;
      for (let k = 0; k < 4; k++) { ctx.beginPath(); ctx.ellipse(0, -s * .62, s * .42, s * .62, 0, 0, 6.29); ctx.fill(); ctx.stroke(); ctx.rotate(Math.PI / 2); }
      ctx.beginPath(); ctx.arc(0, 0, s * .2, 0, 6.29); ctx.fillStyle = '#fff3d6'; ctx.fill();
      ctx.restore();
    }
    requestAnimationFrame(cadru);
  }
  cadru();
})();
</script>
</body>
</html>
